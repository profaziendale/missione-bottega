<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missione Bottega – Economia Aziendale all'Open Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --viola:#6C3BFF; --viola-d:#4B22D1; --corallo:#FF5A5F; --giallo:#FFC93C;
  --menta:#14C8A6; --azzurro:#2EA8FF; --rosa:#FF7AC6;
  --ink:#1D1B3A; --muted:#5F5C80; --bg:#FFF8EC; --card:#FFFFFF; --line:#ECE6FF;
  --ok:#0FA97A; --ko:#E5383B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(10px);opacity:.35;z-index:-1}
body::before{width:420px;height:420px;background:var(--giallo);top:-140px;right:-120px}
body::after{width:360px;height:360px;background:var(--menta);bottom:-140px;left:-120px}
button{font-family:inherit;cursor:pointer;border:none}
input{font-family:inherit}

/* top bar */
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;justify-content:space-between;
  padding:12px 20px;background:rgba(255,248,236,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.brand{font-weight:900;font-size:1.05rem;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand small{display:block;font-weight:600;font-size:.7rem;color:var(--muted);letter-spacing:.02em}
.steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.step{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.1rem;background:#fff;border:2px solid var(--line);transition:.3s}
.step.done{background:var(--menta);border-color:var(--menta)}
.step.now{border-color:var(--viola);box-shadow:0 0 0 4px rgba(108,59,255,.18);transform:scale(1.08)}
.chips{display:flex;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;white-space:nowrap}
.chip.cash{background:var(--giallo);border-color:var(--giallo)}
.chip.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.18)}}

main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.screen{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:28px;padding:30px;box-shadow:0 10px 0 var(--line),0 20px 40px rgba(29,27,58,.07)}
h1{font-size:clamp(2rem,5vw,3.3rem);font-weight:900;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:900;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:800}
p.lead{font-size:1.1rem;color:var(--muted);font-weight:500}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#fff}
.hl{background:linear-gradient(transparent 60%,var(--giallo) 60%);padding:0 4px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:18px;font-weight:800;font-size:1.1rem;
  background:var(--viola);color:#fff;box-shadow:0 6px 0 var(--viola-d);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--viola-d)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--viola-d)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:10px 18px;font-size:.95rem}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.mt{margin-top:22px}.mt-s{margin-top:12px}

/* intro */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero-art{font-size:7rem;text-align:center;line-height:1;position:relative}
.hero-art span{display:inline-block;animation:float 3s ease-in-out infinite}
.hero-art span:nth-child(2){animation-delay:.5s}.hero-art span:nth-child(3){animation-delay:1s}
@keyframes float{50%{transform:translateY(-12px) rotate(-4deg)}}
.mapgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mapitem{background:#F6F3FF;border-radius:16px;padding:12px 8px;text-align:center;font-weight:700;font-size:.8rem}
.mapitem b{display:block;font-size:1.6rem;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
.field input{padding:14px 16px;border-radius:14px;border:2px solid var(--line);font-size:1.05rem;font-weight:600;outline:none;min-width:260px}
.field input:focus{border-color:var(--viola)}

/* stage head */
.stagehead{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.bigicon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;flex:none}
.explain{background:#F6F3FF;border-radius:18px;padding:16px 18px;font-weight:500;margin-bottom:20px}
.explain b{color:var(--viola-d)}

/* classify */
.counter{font-weight:800;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--viola),var(--rosa));border-radius:99px;transition:width .4s}
.itemcard{border:3px dashed var(--line);border-radius:24px;padding:26px;text-align:center;margin-bottom:20px}
.itemcard .em{font-size:4.2rem;line-height:1;display:block;margin-bottom:8px}
.itemcard .nm{font-size:1.4rem;font-weight:800}
.opts{display:grid;gap:14px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:repeat(3,1fr)}.opts.c4{grid-template-columns:1fr 1fr}
.opt{padding:18px 14px;border-radius:20px;font-weight:800;font-size:1.1rem;color:#fff;transition:transform .12s, opacity .2s;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.opt small{display:block;font-weight:600;font-size:.78rem;opacity:.9;margin-top:4px}
.opt:hover{transform:translateY(-3px)}
.opt:disabled{cursor:default;transform:none}
.opt.dim{opacity:.35}
.opt.right{outline:4px solid var(--ok);outline-offset:3px;opacity:1}
.opt.wrong{outline:4px solid var(--ko);outline-offset:3px;opacity:1}
.qopt{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line);font-size:1.25rem}
.feedback{margin-top:18px;border-radius:18px;padding:16px 18px;font-weight:600;display:flex;gap:12px;align-items:flex-start;animation:in .3s}
.feedback.ok{background:#E3FBF2;color:#0B6B4E}
.feedback.ko{background:#FFE8E8;color:#9B1C1F}
.feedback .fe{font-size:1.6rem;line-height:1}
.question{font-size:1.3rem;font-weight:800;margin-bottom:18px}

/* fattura */
.invoice{border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#fff}
.inv-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;background:var(--ink);color:#fff}
.inv-head b{font-size:1.2rem}
.inv-head span{font-size:.85rem;opacity:.85}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;border-bottom:2px solid var(--line);font-weight:600}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#FAF8FF}
td.num,th.num{text-align:right}
.tot td{background:#FFFBEE}
.tot td:first-child{font-weight:800}
.ans{width:130px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);font-size:1.05rem;font-weight:700;text-align:right;outline:none;transition:.2s}
.ans:focus{border-color:var(--viola)}
.ans.good{border-color:var(--ok);background:#E3FBF2}
.ans.bad{border-color:var(--ko);background:#FFE8E8;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hints{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.hint{background:#F6F3FF;border-radius:14px;padding:10px 12px;font-size:.82rem;font-weight:600}
.hint b{display:block;color:var(--viola-d);font-size:.86rem}

/* riparto */
.partners{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.partner{border-radius:22px;padding:18px;color:#fff;text-align:center}
.partner .em{font-size:2.6rem}
.partner .nm{font-weight:900;font-size:1.2rem}
.partner .cap{font-weight:700;opacity:.95;margin:4px 0 12px}
.partner .ans{width:100%;text-align:center;color:var(--ink)}
.stack{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:16px 0 6px;font-weight:800;font-size:.85rem;color:#fff}
.stack div{display:grid;place-items:center}

/* link screen */
.linkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.linkbox{border-radius:22px;padding:20px}
.linkbox .lb-t{font-weight:900;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.linkbox p{font-weight:600}
.lb1{background:#EEE8FF}.lb1 .lb-t{color:var(--viola-d)}
.lb2{background:#E1F7FF}.lb2 .lb-t{color:#0A6FA8}
.lb3{background:#FFF0D1}.lb3 .lb-t{color:#A86A00}
.stagescore{font-size:1.1rem;font-weight:800;margin-bottom:16px}

/* final */
.badge{font-size:5rem;line-height:1;animation:float 3s ease-in-out infinite;display:inline-block}
.final-top{text-align:center}
.score{font-size:3rem;font-weight:900;color:var(--viola)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.list li{list-style:none;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:600;display:flex;gap:10px}
.list li:last-child{border:none}
.bridge{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 12px;align-items:center;font-weight:700;font-size:.92rem}
.bridge .a{background:#E1F7FF;border-radius:12px;padding:8px 12px}
.bridge .b{background:#EEE8FF;border-radius:12px;padding:8px 12px}
.bridge .arr{font-size:1.2rem;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:#FFFBEE;margin-bottom:10px;cursor:pointer;font-weight:600;border:2px solid transparent;transition:.2s;text-align:left;width:100%;color:var(--ink);font-size:1rem}
.check .box{width:28px;height:28px;border-radius:9px;border:3px solid var(--giallo);flex:none;display:grid;place-items:center;font-weight:900;color:#fff;transition:.2s}
.check.on{border-color:var(--menta);background:#E3FBF2}
.check.on .box{background:var(--menta);border-color:var(--menta)}

.confetti{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;z-index:50;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* logo, avatar, video */
.logo{height:46px;width:auto;display:block}
.guide{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.guide .face{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:4px solid #fff;box-shadow:0 0 0 3px var(--viola),0 6px 14px rgba(29,27,58,.15)}
.guide .bubble{position:relative;background:#F6F3FF;border-radius:20px;padding:14px 18px;font-weight:500;flex:1}
.guide .bubble::before{content:"";position:absolute;left:-9px;top:22px;border:10px solid transparent;border-right-color:#F6F3FF;border-left:0}
.guide .bubble b{color:var(--viola-d)}
.guide .who{display:block;font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--corallo);margin-bottom:4px}
.guide.yellow .bubble{background:#FFF0D1}.guide.yellow .bubble::before{border-right-color:#FFF0D1}
.guide.yellow .face{box-shadow:0 0 0 3px var(--giallo),0 6px 14px rgba(29,27,58,.15)}
.hero-av{position:relative;text-align:center}
.hero-av img.full{height:420px;max-width:100%;object-fit:cover;object-position:top;border-radius:32px;border:6px solid #fff;box-shadow:0 12px 0 var(--line),0 20px 40px rgba(29,27,58,.12)}
.hero-av .fl{position:absolute;font-size:2.6rem;animation:float 3s ease-in-out infinite}
.hero-av .say{position:absolute;left:-10px;bottom:30px;background:var(--giallo);font-weight:800;padding:10px 16px;border-radius:18px 18px 18px 4px;box-shadow:0 6px 0 rgba(0,0,0,.12);max-width:220px;text-align:left;font-size:.95rem;animation:float 4s ease-in-out infinite}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 30% 20%,#7d55ff,#3a1aa8 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;text-align:center;padding:20px;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash .logo-box{background:#fff;border-radius:24px;padding:14px 22px}
#splash .logo-box img{height:80px;display:block}
#splash h1{color:#fff}
#splash .btn{background:var(--giallo);color:var(--ink);box-shadow:0 6px 0 #c99a1d;font-size:1.3rem}
#splash video{width:min(96vw,calc(88vh*16/9));aspect-ratio:16/9;border-radius:20px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.4);display:none}
#splash.playing video{display:block}
#splash.playing .pre{display:none}
#splash .btn.alt{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.6);box-shadow:none}
#splash .skip{display:none;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:none;font-size:1rem;padding:10px 20px}
#splash.playing .skip{display:inline-flex}

footer{text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;padding:0 20px 30px}

@media (max-width:760px){
  .hero,.cols,.linkgrid{grid-template-columns:1fr}
  .hero-av img.full{height:320px}
  .mapgrid{grid-template-columns:repeat(3,1fr)}
  .opts.c3{grid-template-columns:1fr}
  .hints{grid-template-columns:1fr 1fr}
  .partners{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap}
  .ans{width:100px}
  th,td{padding:10px 8px;font-size:.88rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><img class="logo" src="assets/logo.svg" alt="Istituto Superiore Ivan Piana"><div>🏪 Missione Bottega<small>Economia Aziendale · Open Day</small></div></div>
  <div class="steps" id="steps"></div>
  <div class="chips">
    <div class="chip" id="timer">⏱️ 00:00</div>
    <div class="chip cash" id="cash">💰 0 €</div>
  </div>
</header>

<div id="splash">
  <div class="pre">
    <div class="logo-box" style="display:inline-block"><img src="assets/logo.svg" alt="Istituto Superiore Ivan Piana"></div>
    <h1 class="mt">Open Day · Economia Aziendale</h1>
    <p style="font-weight:600;font-size:1.1rem;opacity:.9" class="mt-s">Pronti a scoprire come funziona un'azienda? 🚀</p>
    <div class="row mt" style="justify-content:center">
      <button class="btn" id="playIntro">▶ Guarda l'intro</button>
      <button class="btn alt" id="skipPre">Vai al gioco ➜</button>
    </div>
  </div>
  <video id="introVideo" src="assets/intro.mp4" playsinline preload="auto"></video>
  <button class="btn skip" id="skipVid">Salta l'intro ⏭</button>
</div>

<main id="app"></main>
<footer>Attività per l'Open Day · Indirizzo Economico · Durata consigliata 10–15 minuti · Funziona su LIM, PC e tablet</footer>

<script>
/* ===================== DATI ===================== */
const STAGES = [
  {id:'beni',     icon:'🛍️', title:'Beni o servizi?',          color:'var(--corallo)'},
  {id:'settori',  icon:'🏭', title:'In che settore lavora?',    color:'var(--azzurro)'},
  {id:'perc',     icon:'🏷️', title:'Sconti e IVA',              color:'var(--rosa)'},
  {id:'fattura',  icon:'🧾', title:'La tua prima fattura',      color:'var(--menta)'},
  {id:'riparto',  icon:'🚚', title:'Dividiamo il guadagno',     color:'var(--viola)'}
];
const MAX = 1700;

const BENI = {
  options:[
    {key:'bene', label:'Bene', sub:'qualcosa di materiale', color:'var(--corallo)'},
    {key:'servizio', label:'Servizio', sub:'una prestazione', color:'var(--viola)'}
  ],
  items:[
    {em:'👟', nm:'Un paio di sneakers', k:'bene', why:'Puoi toccarle e portarle a casa: sono un bene materiale.'},
    {em:'✂️', nm:'Il taglio di capelli', k:'servizio', why:'Non compri un oggetto ma il lavoro del parrucchiere: è un servizio.'},
    {em:'🍕', nm:'Una pizza margherita', k:'bene', why:'È un prodotto materiale (e buonissimo): è un bene.'},
    {em:'🚌', nm:'Il viaggio in autobus', k:'servizio', why:'Paghi per essere trasportato: è un servizio di trasporto.'},
    {em:'🎧', nm:'Le cuffie wireless', k:'bene', why:'Sono un oggetto fisico: bene materiale.'},
    {em:'🏊', nm:'Il corso di nuoto', k:'servizio', why:'Paghi le lezioni dell\'istruttore: è un servizio.'},
    {em:'🛵', nm:'La consegna a domicilio', k:'servizio', why:'Il cibo è un bene, ma la consegna è una prestazione: servizio!'},
    {em:'📚', nm:'Il libro di scuola', k:'bene', why:'Lo sfogli, lo metti nello zaino: è un bene.'}
  ]
};

const SETTORI = {
  options:[
    {key:'p', label:'Primario', sub:'prende dalla natura', color:'#2FA84F'},
    {key:'s', label:'Secondario', sub:'trasforma', color:'var(--azzurro)'},
    {key:'t', label:'Terziario', sub:'offre servizi', color:'var(--viola)'}
  ],
  items:[
    {em:'🍎', nm:'Azienda agricola che coltiva mele', k:'p', why:'Coltiva la terra: settore primario.'},
    {em:'🚲', nm:'Fabbrica di biciclette', k:'s', why:'Trasforma metallo e gomma in biciclette: settore secondario (industria).'},
    {em:'🏦', nm:'Banca', k:'t', why:'Custodisce e presta denaro: offre servizi, settore terziario.'},
    {em:'🐄', nm:'Allevamento di mucche da latte', k:'p', why:'Alleva animali: settore primario.'},
    {em:'🧀', nm:'Caseificio che produce formaggi', k:'s', why:'Trasforma il latte in formaggio: settore secondario.'},
    {em:'🛒', nm:'Supermercato', k:'t', why:'Non produce: vende ciò che altri producono. Commercio = terziario.'},
    {em:'🏨', nm:'Hotel sul lago', k:'t', why:'Offre ospitalità ai turisti: terziario (turismo).'},
    {em:'⛏️', nm:'Cava di pietra', k:'p', why:'Estrae risorse dalla natura: settore primario.'}
  ]
};

const PERC = [
  {q:'👟 Le sneakers costano 80 € e sono scontate del 25%. Quanto le paghi?',
   opts:['55 €','60 €','64 €','75 €'], a:1,
   why:'25% di 80 = 80 × 25 : 100 = 20 € di sconto → 80 − 20 = <b>60 €</b>. Trucco: 25% è come 1/4!'},
  {q:'🧥 Una felpa costa 50 € senza IVA. L\'IVA è del 22%. Quanto vale l\'IVA?',
   opts:['10 €','11 €','12 €','22 €'], a:1,
   why:'50 × 22 : 100 = <b>11 €</b>. In fattura il prezzo senza IVA si chiama <b>imponibile</b>.'},
  {q:'🎮 Un gioco costa 122 € IVA (22%) compresa. Qual è il prezzo senza IVA?',
   opts:['95,16 €','97,60 €','100 €','110 €'], a:2,
   why:'Trappola! Il 22% si calcola sul prezzo senza IVA, non su 122. Se 100 + 22% = 122, il prezzo senza IVA è <b>100 €</b> (122 : 1,22). È il calcolo «sopra cento»: lo studierai in prima!'}
];

const LINKS = {
  beni:{
    prima:'Bisogni, beni e servizi; chi sono i protagonisti dell\'economia: famiglie, imprese, Stato.',
    medie:'<b>Tecnologia</b> (materiali e produzione), <b>Geografia</b> (le risorse), <b>Educazione civica</b> (lavoro e consumo responsabile).',
    plus:'Allenati a trovare esempi nella vita di tutti i giorni: l\'economia c\'è anche nella tua merenda!'
  },
  settori:{
    prima:'L\'azienda: che cos\'è, i suoi elementi (persone, beni, organizzazione) e i diversi tipi di aziende.',
    medie:'<b>Geografia</b>: i settori economici e le attività del territorio.',
    plus:'Ripassa i tre settori e osserva le aziende della tua zona: cosa producono? In che settore lavorano?'
  },
  perc:{
    prima:'Gli strumenti di calcolo: rapporti, proporzioni, percentuali, calcoli «sopra» e «sotto cento».',
    medie:'<b>Matematica</b>: frazioni, proporzioni e percentuali.',
    plus:'Le percentuali sono la base di tutto! Ricorda: 10% = 1/10, 25% = 1/4, 50% = 1/2. Esercitati con sconti e aumenti.'
  },
  fattura:{
    prima:'La compravendita e i suoi documenti: fattura, documento di trasporto, scontrino. E l\'IVA.',
    medie:'<b>Matematica</b> (operazioni con i decimali) e <b>Italiano</b> (leggere e capire un documento).',
    plus:'Cura l\'ordine: numeri incolonnati, virgole al posto giusto, il simbolo €. E chiediti sempre: «il risultato ha senso?»'
  },

function addCash(n, i){
  if(n<=0) return;
  S.cash += n; S.stageCash[i] += n;
  const c = $('#cash'); c.textContent = '💰 ' + S.cash.toLocaleString('it-IT') + ' €';

  if(!S.start) { $('#timer').textContent='⏱️ 00:00'; return; }
  const t = Math.floor((Date.now()-S.start)/1000);
  $('#timer').textContent = '⏱️ ' + String(Math.floor(t/60)).padStart(2,'0') + ':' + String(t%60).padStart(2,'0');
},500);
function show(html){ app.innerHTML = `<div class="screen">${html}</div>`; window.scrollTo({top:0,behavior:'smooth'}); drawSteps(); }
function parseNum(v){
  v = String(v).replace(/\s|€/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');
  return v==='' ? NaN : parseFloat(v);
}
const fmt = n => n.toLocaleString('it-IT',{minimumFractionDigits:2, maximumFractionDigits:2});
function stageHead(i, sub){

/* ===================== GIOCO DI CLASSIFICAZIONE ===================== */
function classify(i, cfg, explainHTML){
  let n = 0;
  const cols = cfg.options.length===3 ? 'c3' : 'c2';
  function draw(){
    const it = cfg.items[n];
    show(`<div class="card">
      ${stageHead(i)}
      ${guide(explainHTML)}
      <div class="counter">Carta ${n+1} di ${cfg.items.length} · +50 € per ogni risposta giusta</div>
      <div class="bar"><i style="width:${n/cfg.items.length*100}%"></i></div>
      <div class="itemcard"><span class="em">${it.em}</span><span class="nm">${it.nm}</span></div>
      <div class="opts ${cols}">
        ${cfg.options.map(o=>`<button class="opt" data-k="${o.key}" style="background:${o.color}">${o.label}<small>${o.sub}</small></button>`).join('')}
      </div>
      <div id="fb"></div>
    </div>`);
    document.querySelectorAll('.opt').forEach(b=> b.onclick = ()=>answer(b.dataset.k));
  }
  function answer(k){
    const it = cfg.items[n], ok = k===it.k;
    document.querySelectorAll('.opt').forEach(b=>{
      b.disabled = true;
      if(b.dataset.k===it.k) b.classList.add('right');
      else if(b.dataset.k===k) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    if(ok) addCash(50,i);
    const last = n===cfg.items.length-1;
    $('#fb').innerHTML = `<div class="feedback ${ok?'ok':'ko'}"><span class="fe">${ok?'🎉':'🤔'}</span>
      <div><b>${ok?'Esatto!':'Quasi!'}</b> ${it.why}
      <div class="mt-s"><button class="btn small" id="next">${last?'Fine tappa ➜':'Prossima carta ➜'}</button></div></div></div>`;
    $('#next').onclick = ()=>{ n++; if(n<cfg.items.length) draw(); else linkScreen(i); };
    $('#next').focus();
  }
  draw();
}

function percQuiz(i){
  let n = 0;
  function draw(){
    const q = PERC[n];
    show(`<div class="card">
      ${stageHead(i,'La matematica delle medie diventa… soldi veri!')}
      ${n===0?guide('Sconti, IVA, prezzi: in negozio servono <b>sempre</b> le percentuali. Ricorda: <b>x% di un numero = numero × x : 100</b>. Vediamo se sei pronto!'):''}

      <div class="opts c4">${q.opts.map((o,j)=>`<button class="opt qopt" data-j="${j}">${o}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>`);
    document.querySelectorAll('.opt').forEach(b=> b.onclick = ()=>answer(+b.dataset.j));
  }

    const q = PERC[n], ok = j===q.a;

      if(k===q.a) b.classList.add('right'); else if(k===j) b.classList.add('wrong'); else b.classList.add('dim');
    });

    const last = n===PERC.length-1;
    $('#fb').innerHTML = `<div class="feedback ${ok?'ok':'ko'}"><span class="fe">${ok?'🎉':'💡'}</span>
      <div><b>${ok?'Perfetto!':'Ecco come si fa:'}</b> ${q.why}
      <div class="mt-s"><button class="btn small" id="next">${last?'Fine tappa ➜':'Prossima domanda ➜'}</button></div></div></div>`;
    $('#next').onclick = ()=>{ n++; if(n<PERC.length) draw(); else linkScreen(i); };
  }
  draw();
}

/* ===================== ESERCIZI CON CASELLE ===================== */
function inputCheck(i, fields, pointsFirst, pointsLater, onAllDone){
  // fields: [{id, val}]
  let tries = 0;
  const done = {};
  $('#check').onclick = ()=>{
    tries++;
    let allOk = true;
    fields.forEach(f=>{
      const el = document.getElementById(f.id);
      if(done[f.id]) return;
      const v = parseNum(el.value);
      if(!isNaN(v) && Math.abs(v-f.val) < 0.011){
        done[f.id]=true; el.classList.remove('bad'); el.classList.add('good'); el.disabled=true;
        addCash(tries===1?pointsFirst:pointsLater, i);
      } else { allOk=false; el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad'); }
    });
    const fb = $('#fb');
    if(allOk){
      fb.innerHTML = `<div class="feedback ok"><span class="fe">🎉</span><div><b>Tutto giusto!</b> ${onAllDone.msg}
        <div class="mt-s"><button class="btn small" id="next">Fine tappa ➜</button></div></div></div>`;
      $('#check').style.display='none'; $('#sol').style.display='none';
      $('#next').onclick = ()=>linkScreen(i);
    } else {
      fb.innerHTML = `<div class="feedback ko"><span class="fe">🔍</span><div><b>Controlla le caselle rosse.</b> Usa gli aiuti qui sopra e riprova!</div></div>`;
      $('#sol').style.display='inline-flex';
    }
  };
  $('#sol').onclick = ()=>{
    fields.forEach(f=>{ const el=document.getElementById(f.id); if(!done[f.id]){ el.value=fmt(f.val); el.classList.remove('bad'); el.classList.add('good'); el.disabled=true; }});
    $('#fb').innerHTML = `<div class="feedback ok"><span class="fe">💡</span><div><b>Ecco la soluzione.</b> ${onAllDone.msg}
      <div class="mt-s"><button class="btn small" id="next">Fine tappa ➜</button></div></div></div>`;
    $('#check').style.display='none'; $('#sol').style.display='none';
    $('#next').onclick = ()=>linkScreen(i);
  };
}

function confetti(){
  const em = ['🎉','💶','⭐','🪙','🎊','📈'];
  for(let k=0;k<45;k++){
    const d = document.createElement('div');
    d.className='confetti'; d.textContent = em[k%em.length];
    d.style.left = Math.random()*100+'vw';
    d.style.animationDuration = (2.5+Math.random()*2.5)+'s';
    d.style.animationDelay = (Math.random()*1.2)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 6500);
  }
}
function escapeHTML(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
